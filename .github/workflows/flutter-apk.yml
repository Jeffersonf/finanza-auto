name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: mobile
        run: flutter create --platforms=android --org com.jeffersonf --project-name finanza_auto --no-pub .

      - name: Set Android app label
        working-directory: mobile
        run: sed -i 's/android:label="finanza_auto"/android:label="Finanza Auto"/' android/app/src/main/AndroidManifest.xml

      - name: Configure Android native integration & updater
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/kotlin/com/jeffersonf/finanza_auto
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/drawable android/app/src/main/res/xml android/app/src/main/assets
          cp android-addon/src/main/kotlin/com/jeffersonf/finanza_auto/MainActivity.kt android/app/src/main/kotlin/com/jeffersonf/finanza_auto/
          cp android-addon/src/main/kotlin/com/jeffersonf/finanza_auto/FinanzaSummaryWidget.kt android/app/src/main/kotlin/com/jeffersonf/finanza_auto/
          cp android-addon/src/main/res/layout/widget_finanza_summary.xml android/app/src/main/res/layout/
          cp android-addon/src/main/res/drawable/finanza_widget_background.xml android/app/src/main/res/drawable/
          cp android-addon/src/main/res/xml/finanza_summary_widget_info.xml android/app/src/main/res/xml/
          cp android-addon/src/main/res/xml/file_provider_paths.xml android/app/src/main/res/xml/
          cp assets/finanza-auto-backup.json android/app/src/main/assets/
          cp finanza-release.jks android/app/finanza-release.jks

          # Add permissions before <application
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml

          # Add FileProvider and Widget Receiver before </application>
          sed -i '/<\/application>/i\        <receiver android:name=".FinanzaSummaryWidget" android:exported="true">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/finanza_summary_widget_info" />\n        </receiver>\n        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="com.jeffersonf.finanza_auto.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_provider_paths" />\n        </provider>' android/app/src/main/AndroidManifest.xml

          # Configure release signing in android/app/build.gradle.kts
          python3 -c "
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          signing_block = '''
              signingConfigs {
                  getByName(\"debug\") {
                      storeFile = file(\"finanza-release.jks\")
                      storePassword = \"finanza_auto_secret\"
                      keyAlias = \"finanza_key\"
                      keyPassword = \"finanza_auto_secret\"
                  }
              }
          '''
          content = content.replace('android {', 'android {\n' + signing_block, 1)
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            echo '### Flutter build failure' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/\.dart:[0-9].*Error:/p; /Error: /p; /Exception:/p' build.log | head -30 >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::error::$line"; done < <(sed -n '/\.dart:[0-9].*Error:/p; /Error: /p; /Exception:/p' build.log | head -30)
            exit 1
          fi

      - name: Upload build log when compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: mobile/build.log
          if-no-files-found: warn

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanza-auto-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          TAG="v$VERSION"
          echo "Publishing GitHub Release $TAG..."
          gh release create "$TAG" mobile/build/app/outputs/flutter-apk/app-release.apk version.json \
            --title "Finanza Auto $TAG" \
            --notes "Versão $TAG do Finanza Auto com auto-updater integrado e redesign visual Finanza Next OLED." \
            --latest || \
          gh release upload "$TAG" mobile/build/app/outputs/flutter-apk/app-release.apk version.json --clobber
