name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: mobile
        run: flutter create --platforms=android --org com.jeffersonf --project-name finanza_auto --no-pub .

      - name: Set Android app label
        working-directory: mobile
        run: sed -i 's/android:label="finanza_auto"/android:label="Finanza Auto"/' android/app/src/main/AndroidManifest.xml

      - name: Add Android summary widget
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/kotlin/com/jeffersonf/finanza_auto
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/drawable android/app/src/main/res/xml android/app/src/main/assets
          cp android-addon/src/main/kotlin/com/jeffersonf/finanza_auto/FinanzaSummaryWidget.kt android/app/src/main/kotlin/com/jeffersonf/finanza_auto/
          cp android-addon/src/main/res/layout/widget_finanza_summary.xml android/app/src/main/res/layout/
          cp android-addon/src/main/res/drawable/finanza_widget_background.xml android/app/src/main/res/drawable/
          cp android-addon/src/main/res/xml/finanza_summary_widget_info.xml android/app/src/main/res/xml/
          cp assets/finanza-auto-backup.json android/app/src/main/assets/
          sed -i '/<\/application>/i\        <receiver android:name=".FinanzaSummaryWidget" android:exported="true">\
                  <intent-filter>\
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\
                  </intent-filter>\
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/finanza_summary_widget_info" />\
              </receiver>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            echo '### Flutter build failure' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/\.dart:[0-9].*Error:/p; /Error: /p; /Exception:/p' build.log | head -30 >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::error::$line"; done < <(sed -n '/\.dart:[0-9].*Error:/p; /Error: /p; /Exception:/p' build.log | head -30)
            exit 1
          fi

      - name: Upload build log when compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: mobile/build.log
          if-no-files-found: warn

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanza-auto-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
